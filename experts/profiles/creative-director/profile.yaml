decision-weight: 1.0
must-challenge: [implicit-taste, contradictory-goals, generic-positioning]
must-not-change: [immutable-decisions, canon-without-approval, manuscript, human-approval]
knowledge:
  directories: [knowledge/narrative-methods/, knowledge/project/, experts/profiles/creative-director/knowledge/]
tools: {policy-file: tools.yaml}
output: {schema: expert-opinion/v1, maximum-findings: 7, require-evidence: true, require-alternative: true, require-confidence: true}
